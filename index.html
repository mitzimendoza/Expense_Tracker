<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: sidebar + content on laptop, scrollable bottom tab bar on phones.
   Gold-foil accents on warm ivory (light) or deep umber (dark). */
:root{
  color-scheme:light;
  --bg:#FBF8F1; --surface:#FFFFFF; --surface2:#F6F0E1; --ink:#2B2416; --muted:#7B6F58; --line:#E7DDC5;
  --gold:#C79A2E; --gold-ink:#8A6414; --gold-soft:#F5EBC9; --on-gold:#201808;
  --foil:linear-gradient(135deg,#EBCB73 0%,#D2A63E 48%,#B08523 100%);
  --good:#2F7D4F; --bad:#B03A2A; --shadow:0 1px 0 rgba(120,90,20,.06),0 10px 26px -14px rgba(90,65,10,.30);
  --scrim:rgba(20,15,6,.45);
  --f-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#100E0A; --surface:#1A1710; --surface2:#231F14; --ink:#F4ECD8; --muted:#ADA086; --line:#3A311D;
    --gold:#DDB850; --gold-ink:#E8C763; --gold-soft:#2E2610; --on-gold:#201808;
    --good:#6CC08A; --bad:#EE8B7A; --shadow:none; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#100E0A; --surface:#1A1710; --surface2:#231F14; --ink:#F4ECD8; --muted:#ADA086; --line:#3A311D;
  --gold:#DDB850; --gold-ink:#E8C763; --gold-soft:#2E2610; --on-gold:#201808;
  --good:#6CC08A; --bad:#EE8B7A; --shadow:none; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{min-width:0;padding-block:14px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font:600 24px/1 var(--f-display);letter-spacing:.02em}
.brand svg{width:30px;height:30px}
.ctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.ctl select{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.fxchip{min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.fxchip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.fxchip.live i{background:var(--good)}
.fxchip.load i{background:var(--gold);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.fxchip.load i{animation:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar::-webkit-scrollbar{display:none}
.tabbar a{flex:1 0 64px;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"],.side a[aria-current="page"]{color:var(--gold-ink)}
.tabbar a[aria-current="page"]{background:var(--gold-soft)}

@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;padding:28px 18px 24px max(22px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .side nav{display:grid;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
  .side nav a:hover{background:var(--surface2);color:var(--ink)}
  .side nav a[aria-current="page"]{background:var(--gold-soft)}
  .side nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .side .foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5}
  .main{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px));padding-block:22px 48px}
  .tabbar{display:none}
  .top .brand{display:none}
}

.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font:600 clamp(30px,5vw,40px)/1.05 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.phead .sub{color:var(--muted);margin-top:6px;max-width:60ch}
.rule{display:flex;align-items:center;gap:8px;margin-top:12px;width:140px}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--gold);opacity:.7}
.rule i{width:7px;height:7px;transform:rotate(45deg);background:var(--foil)}
.pactions{display:flex;gap:8px;flex-wrap:wrap}

.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{background:var(--foil);color:var(--on-gold);border-color:transparent}
.btn.gold:hover{filter:brightness(1.05)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.armed{border-color:var(--bad);color:var(--bad)}
.icon{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon:hover{border-color:var(--line);color:var(--ink)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon.armed{width:auto;padding:0 10px;font-size:12px;font-weight:700;color:var(--bad);border-color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2,.card h2{font:600 22px/1.2 var(--f-display);margin-bottom:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-bottom:16px}
.stack{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0;display:grid;gap:14px;align-content:start}
.hero{position:relative;overflow:hidden;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:end;padding:22px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%);margin-bottom:16px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--foil)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold-ink);margin-bottom:6px}
.big{font:600 clamp(40px,9vw,60px)/1 var(--f-display);font-feature-settings:"lnum","tnum";color:var(--gold-ink);margin-bottom:8px;overflow-wrap:anywhere}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .big{background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{min-width:0}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:2px}
.stat b{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{display:block;font-size:12px;color:var(--muted)}

.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}
.chip.bad{color:var(--bad);border-color:var(--bad)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bars{display:grid;gap:12px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.bar .bl b{font-weight:600;overflow-wrap:anywhere}
.bar .bl span{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.trend{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:6px}
.trend .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.trend .col .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.trend .col .b{width:100%;max-width:56px;border-radius:8px 8px 3px 3px;background:var(--gold);opacity:.45}
.trend .col.now .b{opacity:1;background:var(--foil)}
.trend .col .m{font-size:12px;font-weight:600;color:var(--muted)}
.trend .col .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}

.list{list-style:none;margin:0;padding:0}

<script>
(function(){
'use strict';

/*LOGIC-START*/
const PPY={monthly:12,quarterly:4,annual:1},MPP={monthly:1,quarterly:3,annual:12};
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
function addMonths(s,add){
  const b=parseD(s),d=b.getDate();
  const t=new Date(b.getFullYear(),b.getMonth()+add,1);
  const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return fmtD(new Date(t.getFullYear(),t.getMonth(),Math.min(d,dim)));
}
function nextDueDay(s,day){
  const b=parseD(s);
  for(let k=0;k<4;k++){
    const t=new Date(b.getFullYear(),b.getMonth()+k,1);
    const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    const c=fmtD(new Date(t.getFullYear(),t.getMonth(),Math.min(day,dim)));
    if(c>s)return c;
  }
  return s;
}
function amortize(o){
  const ppy=PPY[o.frequency]||12,mpp=MPP[o.frequency]||1;
  const n=Math.max(1,Math.round(o.termMonths/mpp));
  const r=(o.rate/100)/ppy;
  const pmt=r===0?o.principal/n:o.principal*r/(1-Math.pow(1+r,-n));
  let bal=o.principal,totalInt=0;const rows=[];
  for(let i=1;i<=n;i++){
    const int=bal*r;
    const prin=i===n?bal:pmt-int;
    bal=Math.max(0,bal-prin);
    totalInt+=int;
    rows.push({i,date:addMonths(o.firstDue,(i-1)*mpp),pay:prin+int,int,prin,bal});
  }
  return{pmt,n,rows,totalInt};
}
function rateOf(code,rates){
  if(code==='USD')return 1;
  const m=rates.manual&&rates.manual[code];
  if(m>0)return m;
  const t=rates.table&&rates.table[code];
  return t>0?t:null;
}
function convert(a,from,to,rates){
  if(from===to)return a;
  const f=rateOf(from,rates),t=rateOf(to,rates);
  if(f==null||t==null)return null;
  return a/f*t;
}
function sumConv(list,to,rates,getAmt,getCur){
  let total=0,skipped=0;
  for(const x of list){const v=convert(getAmt(x),getCur(x),to,rates);if(v==null)skipped++;else total+=v}
  return{total,skipped};
}
/*LOGIC-END*/

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const todayStr=()=>fmtD(new Date());
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:NaN};
const ymAdd=(ym,k)=>{const p=ym.split('-').map(Number);const d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthName=ym=>{const p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})};
const monthShort=ym=>{const p=ym.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString(undefined,{month:'short'})};
const fmtDate=s=>parseD(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtCache={};
const symCache={};
function sym(cur){
  if(symCache[cur])return symCache[cur];
  let v=cur+' ';
  try{const x=new Intl.NumberFormat('en-US',{style:'currency',currency:cur}).formatToParts(1).find(q=>q.type==='currency');if(x)v=x.value}catch(e){}
  return symCache[cur]=v;
}
/* show=true prints the figure even in hidden mode (used inside forms the user is editing) */
function money(n,cur,show){
  if(n==null||isNaN(n))return '—';
  if(ui.hide&&!show)return sym(cur)+'•••••';
  try{
    const f=fmtCache[cur]||(fmtCache[cur]=new Intl.NumberFormat('en-US',{style:'currency',currency:cur}));
    return f.format(n);
  }catch(e){return cur+' '+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
}
const compact=n=>ui.hide?'•••':new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
const fmtRate=x=>x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toFixed(6);

/* ---------- dual currency (PHP + USD side by side) ---------- */
const PRI=()=>S.settings.display==='USD'?'USD':'PHP';
const SEC=()=>PRI()==='PHP'?'USD':'PHP';
function dualParts(n,cur){
  const p=PRI(),s=SEC();
  const a=convert(n,cur,p,S.rates),b=convert(n,cur,s,S.rates);
  const subs=[];
  if(cur!==p&&cur!==s)subs.push(money(n,cur));
  subs.push(b==null?s+' n/a':money(b,s));
  return{main:a==null?money(n,cur):money(a,p),sub:subs.join(' · ')};
}
function dual(n,cur,cls){const d=dualParts(n,cur);return '<span class="dual"><b'+(cls?' class="'+cls+'"':'')+'>'+d.main+'</b><em>'+d.sub+'</em></span>'}
function dualText(n,cur){const d=dualParts(n,cur);return d.main+' · '+d.sub}
/* Equivalents in PHP/USD other than the entered currency, e.g. USD in → "≈ ₱57,630.00" */
function others(n,cur,show){
  const out=['PHP','USD'].filter(c=>c!==cur).map(c=>{const v=convert(n,cur,c,S.rates);return v==null?c+' n/a':money(v,c,show)});
  return '≈ '+out.join(' · ');
}

const LISTS=['categories','expenses','loans','cards','purchases','income','accounts','bills'];
function normalize(raw){
  const d=defaults();
  if(!raw||typeof raw!=='object')return d;
  const o=Object.assign(d,raw);
  o.meta=Object.assign(defaults().meta,raw.meta||{});
  o.settings=Object.assign(defaults().settings,raw.settings||{});
  o.rates=Object.assign(defaults().rates,raw.rates||{});
  o.rates.table=Object.assign({},REF,(raw.rates&&raw.rates.table)||{},{USD:1});
  o.rates.manual=(raw.rates&&raw.rates.manual)||{};
  LISTS.forEach(k=>{o[k]=Array.isArray(raw[k])?raw[k]:[]});
  if(!Array.isArray(o.settings.currencies))o.settings.currencies=['PHP','USD'];
  ['PHP','USD'].forEach(c=>{if(!o.settings.currencies.includes(c))o.settings.currencies.unshift(c)});
  if(o.settings.display!=='USD')o.settings.display='PHP';
  if(typeof o.settings.balanceDues!=='boolean')o.settings.balanceDues=true;
  o.accounts.forEach(a=>{if(!Array.isArray(a.hist))a.hist=[]});
  o.bills.forEach(b=>{if(!b.paid||typeof b.paid!=='object')b.paid={}});
  o.v=2;
  o.loans.forEach(l=>{if(!Array.isArray(l.paid))l.paid=[]});
  o.purchases.forEach(p=>{if(!Array.isArray(p.paid))p.paid=[]});
  return o;
}

/* ---------- calculators ---------- */
function schedCalc(a,paidArr,principal){
  const paid=new Set(paidArr||[]);
  let paidPrin=0;
  a.rows.forEach(r=>{if(paid.has(r.i))paidPrin+=r.prin});
  const unpaid=a.rows.filter(r=>!paid.has(r.i));
  return{a,paid,balance:Math.max(0,principal-paidPrin),unpaid,next:unpaid[0]||null,paidCount:paid.size,left:unpaid.reduce((s,r)=>s+r.pay,0)};
}
function loanCalc(l){return schedCalc(amortize(l),l.paid,l.principal)}
function purchaseCalc(p){
  const a=amortize({principal:p.amount,rate:p.months>1?p.rate:0,termMonths:p.months,frequency:'monthly',firstDue:p.firstDue});
  return schedCalc(a,p.paid,p.amount);
}
function monthSum(ym,catId){
  const list=S.expenses.filter(e=>e.date.slice(0,7)===ym&&(!catId||e.catId===catId));
  return sumConv(list,PRI(),S.rates,e=>e.amount,e=>e.currency);
}
function incomeIn(ym){return S.income.filter(i=>i.recurring?(i.date.slice(0,7)<=ym&&(!i.end||i.end>=ym)):i.date.slice(0,7)===ym)}
function incomeSum(ym){return sumConv(incomeIn(ym),PRI(),S.rates,i=>i.amount,i=>i.currency)}
/* Loan payments and card installments scheduled within a month (paid or not) */
function duesIn(ym){
  const out=[];
  S.loans.forEach(l=>amortize(l).rows.forEach(r=>{if(r.date.slice(0,7)===ym)out.push({amt:r.pay,cur:l.currency})}));
  S.purchases.forEach(p=>purchaseCalc(p).a.rows.forEach(r=>{if(r.date.slice(0,7)===ym)out.push({amt:r.pay,cur:p.currency})}));
  return sumConv(out,PRI(),S.rates,x=>x.amt,x=>x.cur);
}
function monthBalance(ym){
  const inc=incomeSum(ym).total,exp=monthSum(ym).total,dues=S.settings.balanceDues?duesIn(ym).total:0,out=exp+dues;
  return{inc,exp,dues,out,bal:inc-out,rate:inc>0?(inc-out)/inc*100:null};
}
function acctSum(list){return sumConv(list||S.accounts,PRI(),S.rates,a=>a.balance,a=>a.currency).total}
function debtSum(){
  const l=sumConv(S.loans,PRI(),S.rates,x=>loanCalc(x).balance,x=>x.currency).total;
  const c=sumConv(S.purchases,PRI(),S.rates,x=>purchaseCalc(x).left,x=>x.currency).total;
  return{loans:l,cards:c,total:l+c};
}
function avgSpend(n){let s=0;for(let i=1;i<=n;i++){const m=monthBalance(ymAdd(todayStr().slice(0,7),-i));s+=m.out}return s/n}
const budgetPri=c=>c.budget>0?convert(c.budget,c.currency,PRI(),S.rates):null;
function curOptions(sel){

function duesList(){
  const t=todayStr(),horizon=fmtD(new Date(Date.now()+45*864e5));
  const out=[];
  S.loans.forEach(l=>{const c=loanCalc(l);c.unpaid.forEach(r=>{if(r.date<=horizon)out.push({date:r.date,title:l.name,sub:'Loan · payment '+r.i+' of '+c.a.n,amt:r.pay,cur:l.currency})})});
  S.purchases.forEach(p=>{
    const c=purchaseCalc(p),card=S.cards.find(x=>x.id===p.cardId);
    c.unpaid.forEach(r=>{if(r.date<=horizon)out.push({date:r.date,title:p.desc,sub:(card?card.name:'Card')+' · '+(p.months>1?'installment '+r.i+' of '+c.a.n:'paid in full'),amt:r.pay,cur:p.currency})});
  });
  const ym=t.slice(0,7);
  [ym,ymAdd(ym,1)].forEach(m=>billsIn(m).forEach(b=>{const d=billDue(b,m);if(!(b.paid&&b.paid[m])&&d<=horizon&&(m===ym||d>t))out.push({date:d,title:b.name,sub:'Bill · '+catOf(b.catId).name+(b.method?' · '+b.method:''),amt:b.amount,cur:b.currency})}));
  return out.sort((a,b)=>a.date.localeCompare(b.date));

function catBars(ym){
  const p=PRI();
  const cats=S.categories.map(c=>({c,s:monthSum(ym,c.id).total,b:budgetPri(c)})).filter(x=>x.s>0||x.b).sort((a,b)=>b.s-a.s);
  if(!cats.length)return '<div class="empty"><b>No spending yet this month</b>Add an expense to see the split.</div>';
  const max=Math.max.apply(null,cats.map(x=>Math.max(x.s,x.b||0)).concat([1]));
  return '<div class="bars">'+cats.map(x=>{
    const over=x.b&&x.s>x.b;
    const w=x.b?Math.min(100,x.s/x.b*100):x.s/max*100;
    const lbl=x.b?money(x.s,p)+' of '+money(x.b,p):money(x.s,p);
    return '<div class="bar"><div class="bl"><b>'+esc(x.c.name)+(over?' <span class="chip bad">Over</span>':'')+'</b><span'+(over?' class="neg"':'')+'>'+lbl+'</span></div><div class="track"><i style="width:'+Math.max(2,w).toFixed(1)+'%;background:'+(over?'var(--bad)':x.c.color)+'"></i></div></div>';
  }).join('')+'</div><p class="muted" style="font-size:12px;margin-top:8px">Bars with a budget show progress against it. Set budgets in the Budgets tab.</p>';
}
function trendChart(){
  const ym=todayStr().slice(0,7),months=[];for(let i=5;i>=0;i--)months.push(ymAdd(ym,-i));
  const data=months.map(m=>monthBalance(m));
  const vmax=Math.max.apply(null,data.map(d=>Math.max(d.inc,d.out)).concat([1]));
  return '<div class="trend">'+months.map((m,i)=>{const d=data[i];return '<div class="col'+(i===5?' now':'')+'"><span class="v '+sgn(d.bal)+'">'+(d.inc||d.out?esc((d.bal<0?'−':'')+compact(Math.abs(d.bal))):'')+'</span><div class="bw"><div class="b inc" style="height:'+Math.max(2,d.inc/vmax*100).toFixed(1)+'%" title="Income '+esc(money(d.inc,PRI()))+'"></div><div class="b" style="height:'+Math.max(2,d.out/vmax*100).toFixed(1)+'%" title="Spending '+esc(money(d.out,PRI()))+'"></div></div><span class="m">'+esc(monthShort(m))+'</span></div>'}).join('')+'</div>'+
  '<div class="legend"><span><i style="background:var(--good)"></i>Income</span><span><i style="background:var(--gold)"></i>Spending'+(S.settings.balanceDues?' + dues':'')+'</span><span>Figure above = balance ('+PRI()+')</span></div>';

function insights(list,total,p){
  if(!list.length)return '';
  const now=todayStr().slice(0,7),ym=ui.expMonth,pp=ym.split('-').map(Number),dim=new Date(pp[0],pp[1],0).getDate();
  const days=ym===now?new Date().getDate():ym<now?dim:0;
  if(!days)return '';
  let out=statD('Daily average',total/days,p);
  if(ym===now&&ui.expCat==='all'&&!ui.expQ)out+=statD('Projected month-end',total/days*dim,p,'','at this pace');
  const by={};list.forEach(e=>{const v=convert(e.amount,e.currency,p,S.rates);if(v!=null)by[e.catId]=(by[e.catId]||0)+v});
  const top=Object.keys(by).sort((a,b)=>by[b]-by[a])[0];
  if(top&&ui.expCat==='all')out+='<div class="stat"><small>Top category</small><b>'+esc(catOf(top).name)+'</b><span>'+(by[top]/total*100).toFixed(0)+'% of spending</span></div>';
  return out;
}

function billDue(b,ym){const p=ym.split('-').map(Number);const dim=new Date(p[0],p[1],0).getDate();return ym+'-'+pad(Math.min(b.dueDay,dim))}
function billsIn(ym){return S.bills.filter(b=>b.active!==false&&(!b.start||b.start<=ym))}
function viewBills(){
  const p=PRI(),ym=todayStr().slice(0,7),t=todayStr();
  const list=billsIn(ym).map(b=>({b,due:billDue(b,ym),paid:!!(b.paid&&b.paid[ym])})).sort((a,b)=>a.due.localeCompare(b.due));
  const tot=sumConv(list,p,S.rates,x=>x.b.amount,x=>x.b.currency).total;
  const paid=sumConv(list.filter(x=>x.paid),p,S.rates,x=>x.b.amount,x=>x.b.currency).total;

  '<section class="panel"><h2>'+esc(monthName(ym))+'</h2>'+
  (list.length?'<ul class="list">'+list.map(x=>{
    const b=x.b,c=catOf(b.catId),late=!x.paid&&x.due<t;
    return '<li class="row"><span class="dot" style="background:'+c.color+'"></span><div class="rmain"><b>'+esc(b.name)+' '+(x.paid?'<span class="chip gold">Paid</span>':late?'<span class="chip bad">Overdue</span>':'')+'</b><span>Due '+esc(fmtDate(x.due))+' · '+esc(c.name)+(b.method?' · '+esc(b.method):'')+'</span></div><div class="ramt">'+dual(b.amount,b.currency)+'</div><div class="ract">'+
      (x.paid?'<button class="btn sm" type="button" data-act="unpay-bill" data-id="'+esc(b.id)+'">Undo</button>':'<button class="btn sm gold" type="button" data-act="pay-bill" data-id="'+esc(b.id)+'">'+ic('check')+'Paid</button>')+

  }).join('')+'</ul>':'<div class="empty"><b>No bills yet</b>Add rent, utilities, internet, phone, streaming and other subscriptions.</div>')+

  '</section>';
}

/* ---------- rate <-> installment calculator ---------- */
const pmtFor=(P,r,n)=>r===0?P/n:P*r/(1-Math.pow(1+r,-n));
/* Annual % rate that makes an amortized payment equal pmt; null when pmt×n is below the principal */
function solveRate(P,n,pmt,ppy){
  if(!(P>0&&n>0&&pmt>0))return null;
  if(pmt*n<P-0.005)return null;
  if(pmt*n<=P+0.005)return 0;
  let lo=0,hi=1;
  if(pmtFor(P,hi,n)<pmt)return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2;if(pmtFor(P,mid,n)>pmt)hi=mid;else lo=mid}
  return (lo+hi)/2*ppy*100;
}
const fix=(v,d)=>v==null||!isFinite(v)?'':String(+v.toFixed(d));
function termOf(f){
  const g=n=>f.elements[n];
  if(f.dataset.form==='loan'){
    const term=num(g('term').value),fq=g('frequency').value,termM=Math.round(g('unit').value==='years'?term*12:term);
    return{P:num(g('principal').value),termM,ppy:PPY[fq]||12,n:Math.max(1,Math.round(termM/(MPP[fq]||1)))};
  }
  const m=Math.max(1,Math.round(num(g('months').value))||1);
  return{P:num(g('amount').value),termM:m,ppy:12,n:m};
}
/* Fill in the two other fields from whichever of rate / installment / add-on was typed last */
function syncRates(f,src){
  const t=termOf(f),R=f.elements.rate,M=f.elements.pmt,A=f.elements.addon;
  src=src||f.dataset.last||'rate';
  f.dataset.err='';
  if(!(t.P>0)||!(t.termM>0)||!R||!M||!A)return;
  if(f.dataset.form==='pur'&&t.n===1){M.value=fix(t.P,2);if(src!=='rate')R.value='0';A.value='0';return}
  let rate=num(R.value),pmt=num(M.value),addon=num(A.value);
  if(src==='rate'){if(!(rate>=0))return;pmt=pmtFor(t.P,rate/100/t.ppy,t.n)}
  else if(src==='pmt'){if(!(pmt>0))return;rate=solveRate(t.P,t.n,pmt,t.ppy)}
  else{if(!(addon>=0))return;pmt=(t.P+t.P*addon/100*t.termM)/t.n;rate=solveRate(t.P,t.n,pmt,t.ppy)}
  if(rate==null){f.dataset.err='1';if(src!=='rate')R.value='';if(src!=='addon')A.value='';return}
  addon=Math.max(0,(pmt*t.n-t.P)/t.P/t.termM*100);
  if(src!=='rate')R.value=fix(rate,4);
  if(src!=='pmt')M.value=fix(pmt,2);
  if(src!=='addon')A.value=fix(addon,4);
}

/* ---------- encryption (Web Crypto: PBKDF2-SHA256 → AES-256-GCM) ---------- */
const cryptoOK=!!(window.crypto&&crypto.subtle&&window.isSecureContext!==false);
const ITER=310000;
const vault={key:null,salt:null,hint:'',last:Date.now()};
const te=new TextEncoder(),td=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}

async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function encryptStr(txt,key,salt,hint){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(txt));
  return{enc:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct),hint:hint||''};
}
async function decryptEnv(env,pw){
  const salt=unb64(env.salt),key=await deriveKey(pw,salt,env.iter);

}

    if(k){try{lsSet(KEY,JSON.stringify(await encryptStr(txt,k,salt,hint)))}catch(e){toast('Could not encrypt and save')}}
    else lsSet(KEY,txt);
  });
}

async function exportJSON(){

  if(vault.key&&ui.encBackup)base.encrypted=await encryptStr(JSON.stringify(S),vault.key,vault.salt,vault.hint);

async function saveFile(name,text,mime){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const d=await window.claude.use('downloads');
      if(d){await d.save({filename:name,data:text});return 'saved'}
    }
  }catch(e){if(e&&e.code==='declined')return 'declined'}
  try{
    const b=new Blob([text],{type:mime||'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    return 'saved';
  }catch(e){}
  showJson(text);return 'shown';
}
async function doBackup(){
  const enc=vault.key&&ui.encBackup;
  const name='mitzikois-expenses-'+(enc?'encrypted-':'')+'backup-'+todayStr()+'.json';
  const res=await saveFile(name,await exportJSON());
  if(res==='saved'){S.meta.lastBackup=new Date().toISOString();save();render();toast(enc?'Encrypted backup saved':'Backup saved')}
  else if(res==='declined')toast('Download cancelled');
}
const APPS=['mitzikois-expense-tracker','mitzikos-expense-tracker','expense-tracker','aurum-ledger'];
function parseBackup(text){
  let o;
  try{o=JSON.parse(text)}catch(e){return{error:'That is not a valid backup file.'}}
  if(o&&o.encrypted&&o.encrypted.enc)return{needPw:true,env:o.encrypted,when:o.exportedAt};
  if(o&&o.enc&&o.ct)return{needPw:true,env:o,when:null};
  const d=o&&APPS.includes(o.app)&&o.data?o.data:o;
  if(!d||typeof d!=='object'||!Array.isArray(d.categories)||!Array.isArray(d.expenses))return{error:'This does not look like an Expense Tracker backup.'};
  return{data:normalize(d),when:o.exportedAt};
}

  }

function lockErr(m){const e=$('#lock-err');if(e)e.textContent=m}
async function onSecurityForm(kind,f,fd){
  if(kind==='unlock'){
    if(ui.waitUntil&&Date.now()<ui.waitUntil){lockErr('Too many attempts. Wait '+Math.ceil((ui.waitUntil-Date.now())/1000)+' seconds.');return}
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;lockErr('Unlocking…');
    try{
      const r=await decryptEnv(ui.env,String(fd.get('pw')));
      S=normalize(JSON.parse(r.txt));vault.key=r.key;vault.salt=r.salt;vault.hint=ui.env.hint||'';vault.last=Date.now();
      ui.fails=0;ui.env=null;if(S.settings.hideOnLock||(!started&&S.settings.hideOnStart))ui.hide=true;
      hideLock();start();
    }catch(e){
      ui.fails=(ui.fails||0)+1;btn.disabled=false;
      if(ui.fails>=5){ui.waitUntil=Date.now()+30000*(ui.fails-4);lockErr('Wrong password. Locked for '+30*(ui.fails-4)+' seconds.')}
      else lockErr('Wrong password. Try again.');
      const i=$('#f-unpw');if(i){i.value='';i.focus()}
    }
    return;
  }
  if(kind==='setup'){
    const err=pwCheck(fd);if(err){lockErr(err);return}
    S.meta.pwAsked=true;await setPassword(String(fd.get('pw')),String(fd.get('hint')||'').trim());
    hideLock();start();toast('Password set. Your data is now encrypted.');return;
  }
  if(!S)return;
  if(kind==='pw-set'){
    const err=pwCheck(fd);if(err){toast(err);return}
    S.meta.pwAsked=true;await setPassword(String(fd.get('pw')),String(fd.get('hint')||'').trim());render();toast('Password set. Your data is now encrypted.');
  }else if(kind==='pw-change'){
    if(!await verifyCurrent(String(fd.get('current')))){toast('Current password is wrong');return}
    const err=pwCheck(fd);if(err){toast(err);return}
    await setPassword(String(fd.get('pw')),String(fd.get('hint')||'').trim());render();toast('Password changed');
  }else if(kind==='pw-remove'){
    if(!await verifyCurrent(String(fd.get('current')))){toast('Current password is wrong');return}
    vault.key=null;vault.salt=null;vault.hint='';save();render();toast('Password removed. Data is no longer encrypted.');
  }else if(kind==='restore-pw'){
    try{const r=await decryptEnv(ui.pendingEnv.env,String(fd.get('pw')));const d=JSON.parse(r.txt);showRestorePreview({data:normalize(d),when:ui.pendingEnv.when})}
    catch(e){toast('Wrong password for this backup')}
  }
}

    else S.accounts.push(Object.assign({id:uid(),hist:[]},r));

    const x=S.accounts.find(y=>y.id===id),balance=num(fd.get('balance'));
    if(!x||!(balance>=0)){toast('Enter a balance');return}
    if(balance!==x.balance){x.hist=(x.hist||[]).concat([{d:x.updated||todayStr(),b:x.balance}]).slice(-24);x.balance=balance}
    x.updated=todayStr();
    save();render();closeModal();toast('Balance updated');
  }else if(kind==='cur'){
    const code=String(fd.get('code')).trim().toUpperCase(),rate=num(fd.get('rate'));
    if(!/^[A-Z]{3}$/.test(code)){toast('Use a three-letter code such as EUR');return}
    if(S.settings.currencies.includes(code)){toast(code+' is already in the list');return}
    if(rate>0)S.rates.manual[code]=rate;
    if(rateOf(code,S.rates)==null){toast('No rate known for '+code+'. Enter a rate per 1 USD.');return}
    S.settings.currencies.push(code);save();render();toast(code+' added');
  }
});
document.addEventListener('change',function(ev){
  const t=ev.target;
  if(!S)return;
  if(t.matches&&t.matches('input[data-paid]')){
    const p=t.dataset.paid.split(':'),i=parseInt(p[2],10);
    const it=p[0]==='loan'?S.loans.find(x=>x.id===p[1]):S.purchases.find(x=>x.id===p[1]);
    if(it){it.paid=toggleSet(it.paid,i);save();render()}
    return;
  }
  switch(t.id){
    case 'f-month':if(t.value){ui.expMonth=t.value;render()}break;
    case 'f-cat':ui.expCat=t.value;render();break;
    case 'f-imonth':if(t.value){ui.incMonth=t.value;render()}break;
    case 'f-dues':S.settings.balanceDues=t.checked;save();render();break;
    case 'f-hide':ui.hide=t.checked;render();break;
    case 'f-hidestart':S.settings.hideOnStart=t.checked;save();break;
    case 'f-hidelock':S.settings.hideOnLock=t.checked;save();break;
    case 'f-encbk':ui.encBackup=t.checked;break;
    case 'f-autolock':S.settings.autoLock=parseInt(t.value,10)||0;save();toast(S.settings.autoLock?'Auto-lock after '+S.settings.autoLock+' min':'Auto-lock off');break;
    case 'f-irec':{$('#f-iend-w').hidden=!t.checked;$('#f-idate-l').textContent=t.checked?'Starting':'Date received';break}
    case 'f-ecat':case 'f-bcat':{const c=S.categories.find(x=>x.id===t.value);const s=$(t.id==='f-ecat'?'#f-ecur':'#f-bcur');if(c&&s){s.innerHTML=curOptions(c.currency);updateConv()}break}
    case 'f-pcard':case 'f-pdate':{
      const f=$('form[data-form="pur"]');
      const card=S.cards.find(x=>x.id===$('#f-pcard').value);
      if(t.id==='f-pcard'&&card)$('#f-pcur').innerHTML=curOptions(card.currency);
      if(card&&!f.dataset.touched&&$('#f-pdate').value)$('#f-pfirst').value=nextDueDay($('#f-pdate').value,card.dueDay);
      updatePurPreview();break;
    }
    case 'f-pfirst':$('form[data-form="pur"]').dataset.touched='1';updatePurPreview();break;
    case 'cv-amt':case 'cv-from':case 'cv-to':updateConverter();break;
    case 'restore-file':{
      const f=t.files&&t.files[0];if(!f)return;
      const r=new FileReader();r.onload=()=>showRestorePreview(parseBackup(String(r.result)));r.onerror=()=>showRestorePreview({error:'Could not read that file.'});r.readAsText(f);
      break;
    }
  }
  if(t.dataset&&t.dataset.ov){
    const v=num(t.value);
    if(v>0)S.rates.manual[t.dataset.ov]=v;else delete S.rates.manual[t.dataset.ov];
    save();render();toast(v>0?'Manual rate set for '+t.dataset.ov:'Manual rate cleared');
  }
});
const RATE_FIELDS=['rate','pmt','addon'],TERM_FIELDS=['principal','term','unit','frequency','amount','months'];
document.addEventListener('input',function(ev){
  const t=ev.target;
  if(!S)return;
  if(t.id==='f-q'){
    ui.expQ=t.value;const pos=t.selectionStart;render();
    const q=$('#f-q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}
    return;
  }
  const f=t.closest&&t.closest('form[data-form="loan"],form[data-form="pur"]');
  if(f){
    if(RATE_FIELDS.includes(t.name)){f.dataset.last=t.name;syncRates(f,t.name)}
    else if(TERM_FIELDS.includes(t.name))syncRates(f);
  }
  if(t.closest&&t.closest('#modal form'))updateConv();
  if(t.closest&&t.closest('form[data-form="loan"]'))updateLoanPreview();
  else if(t.closest&&t.closest('form[data-form="pur"]'))updatePurPreview();
  else if(t.id==='cv-amt')updateConverter();
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',function(){if(!S)return;route();render();window.scrollTo(0,0)});

/* ---------- auto-lock ---------- */
['pointerdown','keydown','touchstart','wheel'].forEach(e=>document.addEventListener(e,()=>{vault.last=Date.now()},{passive:true}));
function idleCheck(){if(vault.key&&S&&S.settings.autoLock>0&&Date.now()-vault.last>S.settings.autoLock*60000)lock()}
setInterval(idleCheck,10000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')idleCheck();else if(vault.key)save()});

/* ---------- boot ---------- */
let started=false;
function start(){
  applyTheme();route();render();
  refreshRates(false);
  if(!started){started=true;setInterval(()=>{if(S)refreshRates(false)},30*60*1000)}
}
(function init(){
  $('#brandTop').innerHTML=markFor('gmt')+BRAND;
  $('#brandSide').innerHTML=markFor('gms')+BRAND;
  $('#ver').textContent='v'+APP_VERSION+' · '+fmtDate(APP_RELEASE);
  const raw=lsGet(KEY);let parsed=null;
  try{parsed=raw?JSON.parse(raw):null}catch(e){}
  if(parsed&&parsed.enc){
    if(!cryptoOK){lockShell('<h1>Locked</h1><p class="muted">This tracker is password-protected, but this page is not opened over a secure (https) address, so it cannot be unlocked here. Open it from its GitHub Pages link.</p>');return}
    showUnlock(parsed);return;
  }
  S=parsed?normalize(parsed):initial();
  ui.hide=!!S.settings.hideOnStart;
  if(cryptoOK&&!S.meta.pwAsked){applyTheme();showSetup();return}
  start();
})();
})();
</script>
